server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: bff-mobile
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank_batch}
    username: ${DB_USER:bank_batch}
    password: ${DB_PASSWORD:bank_batch}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

security:
  jwt:
    secret: ${MOBILE_JWT_SECRET:mobile-bff-secreto-distinto-al-web-0002}
    issuer: bff-mobile
    expiration-minutes: ${MOBILE_JWT_EXP_MIN:15}

logging:
  level:
    com.duocuc.bankbff: INFO

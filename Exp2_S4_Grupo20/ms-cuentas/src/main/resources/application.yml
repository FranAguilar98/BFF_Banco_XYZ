server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: ms-cuentas
  datasource:
    url: jdbc:h2:mem:mscuentas;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true

logging:
  level:
    com.duocuc.bankbff: INFO
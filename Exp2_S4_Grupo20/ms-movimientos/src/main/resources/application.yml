server:
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: ms-movimientos
  datasource:
    url: jdbc:h2:mem:msmovimientos;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true

logging:
  level:
    com.duocuc.bankbff: INFO

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
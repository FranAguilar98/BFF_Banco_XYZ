server:
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: ms-movimientos
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank_batch}
    username: ${DB_USER:bank_batch}
    password: ${DB_PASSWORD:bank_batch}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

logging:
  level:
    com.duocuc.bankbff: INFO